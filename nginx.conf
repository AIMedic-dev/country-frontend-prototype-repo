server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # El frontend llama al backend directamente (VITE_API_BASE_URL / VITE_WEBSOCKET_URL),
  # no vía proxy. Se elimina el proxy_pass al backend viejo de Azure (rompía nginx si
  # ese host dejaba de resolver).

  location / {
    try_files $uri $uri/ /index.html;
  }
}
